/* ---------- Utilidades (sem innerHTML com dados) ---------- */
function h(tag, attrs, ...filhos) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const f of filhos.flat()) {
    if (f == null || f === false) continue;
    el.append(f instanceof Node ? f : document.createTextNode(String(f)));
  }
  return el;
}

function textoComMarcas(txt) {
  const frag = document.createDocumentFragment();
  for (const parte of txt.split(/(\[CONFIRMAR\])/)) {
    frag.append(parte === "[CONFIRMAR]" ? h("mark", { class: "confirmar" }, parte) : document.createTextNode(parte));
  }
  return frag;
}

let toastTimer;
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const t = h("div", { class: "toast", role: "status" }, msg);
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2600);
}

function modal(titulo, corpo, acoes) {
  const fechar = () => fundo.remove();
  const fundo = h("div", { class: "fundo", onclick: (e) => { if (e.target === fundo) fechar(); } },
    h("div", { class: "modal", role: "dialog", "aria-modal": "true" },

    h("div", {}, h("label", { for: "p" }, "Pessoa"), p), h("div", {}, h("label", { for: "rel" }, "Relação"), rel), h("div", {}, h("label", { for: "ang" }, "Sobre o que ela deve falar"), ang)),
    [{ nome: "Gerar pedido", fn: () => {
      if (!p.value.trim()) { toast("Informe o nome."); return false; }
      const r = { id: "r" + Date.now(), pessoa: p.value.trim(), relacao: rel.value.trim() || "—", angulo: ang.value.trim() || "nosso trabalho juntos", status: "pedido", pedido: HOJE };
      db.recomendacoes.unshift(r); render(); verPedido(r);
    } }]);
}

/* ---------- Perfil ---------- */
function telaPerfil(aba) {
  aba = aba || "ficha";
  const ABAS = { ficha: "Ficha", nota: "Nota do perfil", preferencias: "Preferências", curriculos: "Currículos", dados: "Meus dados" };
  const conteudo = { ficha: abaFicha, nota: abaNota, preferencias: abaPreferencias, curriculos: abaCurriculos, dados: abaDados }[aba] || abaFicha;
  return h("div", { class: "stack" },
    h("div", { class: "topo" }, h("div", {}, h("h1", {}, "Perfil"), h("p", { class: "muted small", style: "margin:4px 0 0" }, db.usuario.nome + " · " + db.usuario.email))),
    h("div", { class: "tabs" }, Object.entries(ABAS).map(([k, n]) => h("button", { class: aba === k ? "ativo" : "", onclick: () => { location.hash = "#perfil/" + k; } }, n))),
    conteudo());
}

function abaFicha() {
  const ROT = { confirmado: ["ok", "confirmado"], a_confirmar: ["warn", "a confirmar"], proibido: ["bad", "proibido"] };
  const pend = aConfirmar().length;
  return h("div", { class: "stack" },
    pend ? h("div", { class: "aviso" }, pend + " itens estão a confirmar. A IA só usa itens confirmados — por isso alguns textos saem com [CONFIRMAR].") : null,
    Object.values(db.ficha).map((sec) => h("div", { class: "card" },
      h("div", { class: "row", style: "justify-content:space-between;margin-bottom:6px" }, h("h3", {}, sec.nome),
        h("button", { class: "btn mini", onclick: () => novoItem(sec) }, "+ Item")),
      sec.itens.map((it) => h("div", { class: "item-ficha" + (it.s === "a_confirmar" ? " destaque" : "") },
        h("div", { class: "t" }, it.t),
        h("span", { class: "chip " + ROT[it.s][0] }, ROT[it.s][1]),
        it.s === "a_confirmar" ? h("div", { class: "row" },
          h("button", { class: "btn mini", onclick: () => { it.s = "confirmado"; toast("Item confirmado — a IA já pode usar."); render(); } }, "Confirmar"),
          h("button", { class: "btn mini perigo", onclick: () => { it.s = "proibido"; toast("Marcado como proibido — a IA nunca vai afirmar isso."); render(); } }, "Não é verdade")) : null)))));
}
function novoItem(sec) {
  const t = h("input", { type: "text", id: "t", placeholder: "Escreva o item" });
  modal("Novo item em “" + sec.nome + "”", h("div", {}, h("label", { for: "t" }, "Texto"), t),
    [{ nome: "Adicionar como confirmado", fn: () => { if (!t.value.trim()) return false; sec.itens.push({ t: t.value.trim(), s: "confirmado" }); render(); } }]);
}

function abaNota() {
  const total = notaPerfil();
  return h("div", { class: "stack" },
    h("div", { class: "card row", style: "gap:18px" },
      h("div", { class: "nota " + classeNota(total), style: "width:72px;height:72px;font-size:1.6rem" }, total),
      h("div", {}, h("h2", {}, "Nota do perfil: " + total + "/100"), h("p", { class: "muted small", style: "margin:4px 0 0" }, "Calculada a partir do seu currículo base e do LinkedIn. Rubrica v1."))),
    db.rubrica.map((r) => h("div", { class: "card stack", style: "gap:8px" },
      h("div", { class: "row", style: "justify-content:space-between" }, h("b", {}, r.item), h("span", { class: "muted" }, r.pontos + "/" + r.max)),
      h("div", { class: "barra" }, h("i", { style: "width:" + (r.pontos / r.max * 100) + "%" })),
      r.dica ? h("div", { class: "small muted" }, "Para subir: " + r.dica) : h("div", { class: "small", style: "color:var(--ok)" }, "Ótimo neste item."),
      r.comprovacao ? blocoComprovacao(r) : null)),
    h("div", {}, h("button", { class: "btn prim", onclick: () => toast("Reanalisando… (simulado)") }, "Reanalisar perfil")));
}

/* Comprovação por imagem: o candidato envia um print, a IA confere contra o critério do item. */
function blocoComprovacao(r) {
  const c = r.comprovacao;
  const ROT = { aprovado: ["ok", "✓ comprovado"], reprovado: ["bad", "✗ não conferiu"], analisando: ["warn", "analisando…"] };
  const entrada = h("input", { type: "file", accept: "image/png,image/jpeg,image/webp", style: "display:none", onchange: (e) => enviarPrint(r, e.target.files[0]) });
  return h("div", { style: "border-top:1px dashed var(--border);padding-top:10px;margin-top:4px", class: "stack" },
    h("div", { class: "row", style: "justify-content:space-between" },
      h("span", { class: "small" }, h("b", {}, "Comprovação por imagem")),
      c.status ? h("span", { class: "chip " + ROT[c.status][0] }, ROT[c.status][1]) : h("span", { class: "chip" }, "pendente")),
    h("div", { class: "small muted" }, c.pedido),
    c.preview ? h("img", { src: c.preview, alt: "Print enviado", style: "max-width:100%;max-height:180px;border-radius:8px;border:1px solid var(--border);object-fit:contain;align-self:flex-start" }) : null,
    c.motivo && c.status !== "analisando" ? h("div", { class: "small", style: c.status === "aprovado" ? "color:var(--ok)" : "color:var(--bad)" }, "Análise da IA: " + c.motivo) : null,
    c.status === "analisando" ? null : h("div", { class: "row" }, entrada,
      h("button", { class: "btn " + (c.status === "aprovado" ? "" : "prim"), onclick: () => entrada.click() },
        c.status === "aprovado" ? "Enviar novo print" : c.status === "reprovado" ? "Corrigi, enviar outro print" : "Enviar print"),
      c.data && c.status !== "analisando" ? h("span", { class: "small muted" }, "último envio " + dataBr(c.data)) : null),
    h("div", { class: "small muted" }, "PNG, JPG ou WebP. A imagem é reduzida no navegador antes de enviar e guardada na sua pasta privada."));
}

function reduzirImagem(arquivo, ladoMax) {
  return new Promise((ok, falha) => {
    const img = new Image();
    img.onload = () => {
      const esc = Math.min(1, ladoMax / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * esc); cv.height = Math.round(img.height * esc);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(img.src);
      ok(cv.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => falha(new Error("imagem inválida"));
    img.src = URL.createObjectURL(arquivo);
  });
}

async function enviarPrint(r, arquivo) {
  if (!arquivo) return;
  if (!/^image\/(png|jpeg|webp)$/.test(arquivo.type)) return toast("Envie PNG, JPG ou WebP.");
  if (arquivo.size > 10 * 1024 * 1024) return toast("Imagem acima de 10 MB.");
  const c = r.comprovacao;
  try { c.preview = await reduzirImagem(arquivo, 1600); } catch { return toast("Não consegui ler essa imagem."); }
  c.status = "analisando"; c.motivo = ""; render();
  setTimeout(() => {
    c.tentativas = (c.tentativas || 0) + 1; c.data = HOJE;
    // Simulação: no item do LinkedIn, a 1ª tentativa falha para mostrar o fluxo de correção.
    if (r.item === "Coerência com LinkedIn" && c.tentativas === 1) {
      c.status = "reprovado";
      c.motivo = "O título no print é “Analista de Dados Jr”, mas o currículo diz “Analista de Dados Pleno”. Atualize o título no LinkedIn e envie outro print.";
    } else {
      c.status = "aprovado";
      c.motivo = r.item === "Coerência com LinkedIn" ? "Título e cargo atual no print batem com o currículo base." : "O print confirma a alteração pedida.";
      if (r.pontos < r.max) { r.pontos = r.max; r.dica = ""; }
    }
    toast(c.status === "aprovado" ? "Comprovado! A nota foi atualizada." : "A IA não conseguiu confirmar a alteração.");
    if (rota().pag === "perfil") render();
  }, 1500);
}

function abaPreferencias() {
  const p = db.preferencias;
  const campo = (id, rot, el) => h("div", {}, h("label", { for: id }, rot), el);
  return h("div", { class: "card stack" },
    campo("pt", "Cargos que procuro", h("input", { type: "text", id: "pt", value: p.titulos })),
    h("div", {}, h("label", {}, "Modalidades"), h("div", { class: "row" }, ["Remoto", "Híbrido", "Presencial"].map((m) =>
      h("button", { class: "chip" + (p.modalidades.includes(m) ? " sel" : ""), onclick: () => { p.modalidades = p.modalidades.includes(m) ? p.modalidades.filter((x) => x !== m) : [...p.modalidades, m]; render(); } }, m)))),
    campo("pu", "Estados (UF)", h("input", { type: "text", id: "pu", value: p.ufs })),
    h("label", { class: "row", style: "color:var(--fg);font-size:.95rem" }, h("input", { type: "checkbox", checked: p.aceitaPj, onchange: (e) => { p.aceitaPj = e.target.checked; } }), "Aceito contrato PJ"),
    campo("pn", "Nota mínima para mostrar vaga como nova: " + p.notaMinima, h("input", { type: "range", id: "pn", min: "40", max: "95", step: "5", value: p.notaMinima, style: "width:100%",
      onchange: (e) => { p.notaMinima = +e.target.value; render(); } })),
    h("div", {}, h("button", { class: "btn prim", onclick: () => toast("Preferências salvas. O agente usa na próxima busca.") }, "Salvar")));
}

function abaCurriculos() {
  return h("div", { class: "stack" },
    h("div", { class: "card stack" },
      h("h3", {}, "Enviar currículo"),
      h("p", { class: "small muted", style: "margin:0" }, "PDF de até 5 MB. O currículo base é a fonte dos textos adaptados."),
      h("div", { class: "row" }, h("input", { type: "file", accept: "application/pdf", onchange: (e) => {
        const f = e.target.files[0]; if (!f) return;
        if (f.size > 5 * 1024 * 1024) return toast("Arquivo acima de 5 MB.");
        db.curriculos.unshift({ nome: f.name, tipo: "base", paginas: "?", data: HOJE }); toast("Currículo recebido (simulado)."); render();
      } }))),
    db.curriculos.map((c) => h("div", { class: "card row", style: "justify-content:space-between" },
      h("div", {}, h("b", {}, c.nome), h("div", { class: "small muted" }, c.tipo + " · " + c.paginas + " páginas · " + dataBr(c.data))),
      h("button", { class: "btn mini perigo", onclick: () => { db.curriculos = db.curriculos.filter((x) => x !== c); toast("Currículo removido."); render(); } }, "Remover"))));
}

function abaDados() {
  return h("div", { class: "stack" },
    h("div", { class: "card stack" }, h("h3", {}, "Baixar meus dados"), h("p", { class: "small muted", style: "margin:0" }, "Ficha, candidaturas, textos e currículos num arquivo .zip."),
      h("div", {}, h("button", { class: "btn", onclick: () => toast("Exportação preparada (simulado).") }, "Baixar"))),
    h("div", { class: "card stack" }, h("h3", { style: "color:var(--bad)" }, "Apagar minha conta"), h("p", { class: "small muted", style: "margin:0" }, "Remove todos os seus dados da planilha e do Drive. Não dá para desfazer."),
      h("div", {}, h("button", { class: "btn perigo", onclick: () => modal("Apagar tudo?", h("p", {}, "Todos os seus dados serão apagados permanentemente."),
        [{ nome: "Apagar", classe: "perigo", fn: () => { toast("Conta apagada (simulado)."); sair(); } }]) }, "Apagar conta"))));
}

render();
</script>
