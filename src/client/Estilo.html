<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --fg: #18202e; --muted: #5e6878; --border: #dde2ea;
    --accent: #1f3864; --accent-fg: #ffffff; --bad: #b42318;
    --ok: #1a7f37; --warn: #9a6700; --warn-soft: #fff4d6; --surface-2: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151c; --surface: #181e28; --fg: #e5e9f0; --muted: #98a2b3; --border: #2c3546;
      --accent: #9db8ea; --accent-fg: #11151c; --bad: #f59a92;
      --ok: #6fd08c; --warn: #e3b341; --warn-soft: #2d2614; --surface-2: #222a37;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input { font: inherit; color: inherit; }
  h1 { color: var(--accent); margin: 0; font-size: 1.5rem; }
  h2 { margin: 0; font-size: 1.15rem; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .centro { text-align: center; padding: 48px 16px; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login .card { width: 100%; max-width: 380px; padding: 28px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  input[type=email], input[type=text] { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .codigo { letter-spacing: .5em; text-align: center; font-size: 1.3rem; }
  .btn { border: 1px solid var(--border); background: var(--surface); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
  .btn.prim { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn.mini { padding: 3px 10px; font-size: .85rem; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.perigo { color: var(--bad); border-color: var(--bad); }
  .termo { max-width: 560px !important; }
  .termo ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
  .linha { display: flex; gap: 8px; align-items: flex-start; color: var(--fg); font-size: .95rem; }
  .erro { color: var(--bad); margin: 0; min-height: 1.2em; font-size: .9rem; }
  .topo-app { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .topo-app .marca { font-weight: 700; color: var(--accent); margin-right: auto; }
  nav { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 16px; }
  nav a { color: var(--accent); }
  nav a.ativo { font-weight: 700; text-decoration: none; }
  h3 { margin: 0; font-size: 1rem; }
  textarea, select { font: inherit; color: inherit; width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  textarea { resize: vertical; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row.entre { justify-content: space-between; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); }
  .tabs a { padding: 8px 12px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; }
  .tabs a.ativo { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .aviso { margin: 0; padding: 10px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--fg); border: 1px solid var(--warn); }
  .msg { margin: 0; min-height: 1.2em; font-size: .9rem; color: var(--ok); }
  .dica { margin: 2px 0 6px; }
  .chip { font-size: .78rem; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
  .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
  .item-ficha { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--border); }
  .item-ficha .t { flex: 1 1 240px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .item-ficha.destaque { background: var(--warn-soft); margin: 0 -20px; padding: 10px 20px; }
  .item-ficha.form-item { display: flex; flex-direction: column; align-items: stretch; }
  .acoes { gap: 6px; }
  .texto-gerado { white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--border); border-radius: 8px; padding: 12px; background: var(--bg); line-height: 1.55; }
  .confirmar { background: var(--warn-soft); color: var(--warn); font-weight: 600; border-radius: 4px; padding: 0 3px; }
  .reescrita + .reescrita { border-top: 1px solid var(--border); padding-top: 12px; }
  .aviso ul { margin: 6px 0 0; padding-left: 20px; }
</style>
