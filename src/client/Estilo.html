<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --fg: #18202e; --muted: #5e6878; --border: #dde2ea;
    --accent: #1f3864; --accent-fg: #ffffff; --bad: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151c; --surface: #181e28; --fg: #e5e9f0; --muted: #98a2b3; --border: #2c3546;
      --accent: #9db8ea; --accent-fg: #11151c; --bad: #f59a92;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input { font: inherit; color: inherit; }
  h1 { color: var(--accent); margin: 0; font-size: 1.5rem; }
  h2 { margin: 0; font-size: 1.15rem; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .centro { text-align: center; padding: 48px 16px; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login .card { width: 100%; max-width: 380px; padding: 28px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  input[type=email], input[type=text] { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .codigo { letter-spacing: .5em; text-align: center; font-size: 1.3rem; }
  .btn { border: 1px solid var(--border); background: var(--surface); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
  .btn.prim { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn.mini { padding: 3px 10px; font-size: .85rem; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.perigo { color: var(--bad); border-color: var(--bad); }
  .termo { max-width: 560px !important; }
  .termo ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
  .linha { display: flex; gap: 8px; align-items: flex-start; color: var(--fg); font-size: .95rem; }
  .erro { color: var(--bad); margin: 0; min-height: 1.2em; font-size: .9rem; }
  .topo-app { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .topo-app .marca { font-weight: 700; color: var(--accent); margin-right: auto; }
  nav { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 16px; }
  nav a { color: var(--accent); }
</style>
